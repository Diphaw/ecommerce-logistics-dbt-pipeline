services:
  postgres_olist:
    image: postgres:15-alpine
    container_name: postgres_olist_logistics
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-olist_logistics_db}
    ports:
      - "${DB_PORT:-5435}:5432"
    volumes:
      - pgdata_olist:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-olist_logistics_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata_olist:
