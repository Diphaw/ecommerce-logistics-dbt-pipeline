version: 2

models:
  - name: stg_olist__customers
    description: Cleaned customers. `customer_id` is order-scoped; `customer_unique_id` identifies the person.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: customer_unique_id
        data_tests: [not_null]
      - name: state
        data_tests: [not_null]

  - name: stg_olist__orders
    description: Typed orders with lifecycle timestamps.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__customers')
                field: customer_id
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - created
                  - approved
                  - invoiced
                  - processing
                  - shipped
                  - delivered
                  - unavailable
                  - canceled
      - name: purchased_at
        data_tests: [not_null]

  - name: stg_olist__order_items
    description: One row per order item. Grain is (`order_id`, `order_item_number`).
    columns:
      - name: order_item_key
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__orders')
                field: order_id
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__products')
                field: product_id
      - name: seller_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__sellers')
                field: seller_id
      - name: price
        data_tests: [not_null]
      - name: freight_value
        data_tests: [not_null]

  - name: stg_olist__order_payments
    description: One row per payment record. Grain is (`order_id`, `payment_sequence_number`).
    columns:
      - name: payment_key
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__orders')
                field: order_id
      - name: payment_type
        data_tests:
          - accepted_values:
              arguments:
                values: [credit_card, boleto, voucher, debit_card, not_defined]
      - name: payment_value
        data_tests: [not_null]

  - name: stg_olist__order_reviews
    description: >
      Raw-grain reviews. `review_id` is NOT unique upstream (the same id can appear on several
      orders) and an order can have several reviews; deduplication happens in the intermediate layer.
    columns:
      - name: review_id
        data_tests: [not_null]
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__orders')
                field: order_id
      - name: review_score
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false

  - name: stg_olist__products
    description: Typed product catalogue with upstream column typos corrected.
    columns:
      - name: product_id
        data_tests: [unique, not_null]

  - name: stg_olist__sellers
    description: Cleaned sellers.
    columns:
      - name: seller_id
        data_tests: [unique, not_null]
      - name: state
        data_tests: [not_null]

  - name: stg_olist__geolocation
    description: Raw-grain geolocation (many rows per zip prefix). Aggregated in the intermediate layer.
    columns:
      - name: zip_code_prefix
        data_tests: [not_null]

  - name: stg_olist__product_category_translation
    description: Portuguese to English category names.
    columns:
      - name: category_name
        data_tests: [unique, not_null]
      - name: category_name_english
        data_tests: [not_null]

