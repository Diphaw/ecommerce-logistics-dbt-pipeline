name: dbt_olist_logistics
version: "1.0.0"
config-version: 2

profile: dbt_olist_logistics

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]

clean-targets:
  - target
  - dbt_packages

vars:
  # Orders delivered later than this many days past the estimate are flagged as severely late.
  severe_delay_threshold_days: 7

models:
  dbt_olist_logistics:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table

